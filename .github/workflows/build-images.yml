name: build-images
# Build workflow for this fork — separate from upstream's docker_build.yml,
# which is hard-gated to only ever run/push on mod-playerbots/azerothcore-wotlk and
# would silently no-op here. Manual trigger only, tags images distinctly (never
# ":master") so nothing gets overwritten until validated.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag to build and push'
        required: true
        default: 'quest-loot-fix-test'

env:
  DOCKER_BUILDKIT: 1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - uses: actions/checkout@v7

      # modules/* is gitignored in this repo (by design — see modules/CMakeLists.txt's
      # generic auto-discovery), so every module needed in the image has to be
      # checked out explicitly, same pattern as upstream's own "Download Eluna" step.
      - name: Checkout mod-playerbots
        uses: actions/checkout@v7
        with:
          repository: mod-playerbots/mod-playerbots
          path: modules/mod-playerbots

      - name: Checkout mod-solocraft
        uses: actions/checkout@v7
        with:
          repository: azerothcore/mod-solocraft
          path: modules/mod-solocraft

      - name: Checkout mod-llm-chatter
        uses: actions/checkout@v7
        with:
          repository: Hokken/mod-llm-chatter
          path: modules/mod-llm-chatter

      - name: Checkout mod-ah-bot
        uses: actions/checkout@v7
        with:
          repository: NathanHandley/mod-ah-bot-plus
          path: modules/mod-ah-bot

      - name: Checkout mod-individual-progression
        uses: actions/checkout@v7
        with:
          repository: ZhengPeiRu21/mod-individual-progression
          path: modules/mod-individual-progression

      - name: Checkout mod-npc-buffer
        uses: actions/checkout@v7
        with:
          repository: azerothcore/mod-npc-buffer
          path: modules/mod-npc-buffer

      - name: Checkout mod-cfbg
        uses: actions/checkout@v7
        with:
          repository: azerothcore/mod-cfbg
          path: modules/mod-cfbg

      - name: Checkout mod-account-achievements
        uses: actions/checkout@v7
        with:
          repository: azerothcore/mod-account-achievements
          path: modules/mod-account-achievements

      - name: Checkout mod-instance-reset
        uses: actions/checkout@v7
        with:
          repository: azerothcore/mod-instance-reset
          path: modules/mod-instance-reset

      - name: Checkout mod-random-enchants
        uses: actions/checkout@v7
        with:
          repository: azerothcore/mod-random-enchants
          path: modules/mod-random-enchants

      - name: Patch known mod-llm-chatter compile bug
        run: python3 apps/docker/patch-llm-chatter.py

      - name: Patch mod-playerbots to defer shared quest items to the master
        run: python3 apps/docker/patch-playerbots-quest-loot.py

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: build worldserver
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ac-wotlk-worldserver-playerbots:${{ inputs.tag }}
          target: worldserver
          build-args: |
            USER_ID=1000
            GROUP_ID=1000
            DOCKER_USER=acore

      - name: build authserver
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ac-wotlk-authserver-playerbots:${{ inputs.tag }}
          target: authserver
          build-args: |
            USER_ID=1000
            GROUP_ID=1000
            DOCKER_USER=acore

      - name: build db-import
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ac-wotlk-db-import-playerbots:${{ inputs.tag }}
          target: db-import
          build-args: |
            USER_ID=1000
            GROUP_ID=1000
            DOCKER_USER=acore

      - name: build client-data
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ac-wotlk-client-data-playerbots:${{ inputs.tag }}
          target: client-data
          build-args: |
            USER_ID=1000
            GROUP_ID=1000
            DOCKER_USER=acore
