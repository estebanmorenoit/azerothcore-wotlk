name: build-images
# Build workflow for this fork — separate from upstream's docker_build.yml,
# which is hard-gated to only ever run/push on mod-playerbots/azerothcore-wotlk and
# would silently no-op here. Manual trigger only, tags images distinctly (never
# ":master") so nothing gets overwritten until validated.
#
# Publishes to GHCR (ghcr.io/estebanmorenoit/...), not Docker Hub: auth is the
# repo's own ephemeral GITHUB_TOKEN (scoped to this one run, expires with it)
# rather than a long-lived Docker Hub PAT stored as two separate secrets and
# again in this host's own ~/.docker/config.json. Each image also gets a real
# SLSA-style build provenance attestation (which commit/workflow run built it,
# verifiable via `gh attestation verify`) and an SBOM, both attached directly
# to the pushed image.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag to build and push'
        required: true
        default: 'quest-loot-fix-test'

env:
  DOCKER_BUILDKIT: 1
  REGISTRY: ghcr.io
  IMAGE_OWNER: estebanmorenoit

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - uses: actions/checkout@v7

      # Each module used to be checked out at whatever its default branch's
      # HEAD happened to be at build time - no record anywhere of exactly
      # what version actually went into a given image, and two builds a
      # week apart could silently differ. modules.lock.json pins each one
      # to a specific commit instead; bump a pin deliberately via
      # update-module-pin.yml, not by this file just floating forward on
      # its own. check-module-updates.yml watches for new upstream commits
      # and opens an issue, but never writes to this lock file itself -
      # noticing and updating stay two separate, deliberate steps.
      - name: Read module version pins
        id: lock
        run: |
          echo "playerbots_sha=$(jq -r '.["mod-playerbots/mod-playerbots"]' modules.lock.json)" >> "$GITHUB_OUTPUT"
          echo "solocraft_sha=$(jq -r '.["azerothcore/mod-solocraft"]' modules.lock.json)" >> "$GITHUB_OUTPUT"
          echo "llm_chatter_sha=$(jq -r '.["Hokken/mod-llm-chatter"]' modules.lock.json)" >> "$GITHUB_OUTPUT"
          echo "ah_bot_sha=$(jq -r '.["NathanHandley/mod-ah-bot-plus"]' modules.lock.json)" >> "$GITHUB_OUTPUT"
          echo "individual_progression_sha=$(jq -r '.["ZhengPeiRu21/mod-individual-progression"]' modules.lock.json)" >> "$GITHUB_OUTPUT"
          echo "npc_buffer_sha=$(jq -r '.["azerothcore/mod-npc-buffer"]' modules.lock.json)" >> "$GITHUB_OUTPUT"
          echo "cfbg_sha=$(jq -r '.["azerothcore/mod-cfbg"]' modules.lock.json)" >> "$GITHUB_OUTPUT"
          echo "account_achievements_sha=$(jq -r '.["azerothcore/mod-account-achievements"]' modules.lock.json)" >> "$GITHUB_OUTPUT"
          echo "instance_reset_sha=$(jq -r '.["azerothcore/mod-instance-reset"]' modules.lock.json)" >> "$GITHUB_OUTPUT"
          echo "random_enchants_sha=$(jq -r '.["azerothcore/mod-random-enchants"]' modules.lock.json)" >> "$GITHUB_OUTPUT"

      # modules/* is gitignored in this repo (by design — see modules/CMakeLists.txt's
      # generic auto-discovery), so every module needed in the image has to be
      # checked out explicitly, same pattern as upstream's own "Download Eluna" step.
      - name: Checkout mod-playerbots
        uses: actions/checkout@v7
        with:
          repository: mod-playerbots/mod-playerbots
          ref: ${{ steps.lock.outputs.playerbots_sha }}
          path: modules/mod-playerbots

      - name: Checkout mod-solocraft
        uses: actions/checkout@v7
        with:
          repository: azerothcore/mod-solocraft
          ref: ${{ steps.lock.outputs.solocraft_sha }}
          path: modules/mod-solocraft

      - name: Checkout mod-llm-chatter
        uses: actions/checkout@v7
        with:
          repository: Hokken/mod-llm-chatter
          ref: ${{ steps.lock.outputs.llm_chatter_sha }}
          path: modules/mod-llm-chatter

      - name: Checkout mod-ah-bot
        uses: actions/checkout@v7
        with:
          repository: NathanHandley/mod-ah-bot-plus
          ref: ${{ steps.lock.outputs.ah_bot_sha }}
          path: modules/mod-ah-bot

      - name: Checkout mod-individual-progression
        uses: actions/checkout@v7
        with:
          repository: ZhengPeiRu21/mod-individual-progression
          ref: ${{ steps.lock.outputs.individual_progression_sha }}
          path: modules/mod-individual-progression

      - name: Checkout mod-npc-buffer
        uses: actions/checkout@v7
        with:
          repository: azerothcore/mod-npc-buffer
          ref: ${{ steps.lock.outputs.npc_buffer_sha }}
          path: modules/mod-npc-buffer

      - name: Checkout mod-cfbg
        uses: actions/checkout@v7
        with:
          repository: azerothcore/mod-cfbg
          ref: ${{ steps.lock.outputs.cfbg_sha }}
          path: modules/mod-cfbg

      - name: Checkout mod-account-achievements
        uses: actions/checkout@v7
        with:
          repository: azerothcore/mod-account-achievements
          ref: ${{ steps.lock.outputs.account_achievements_sha }}
          path: modules/mod-account-achievements

      - name: Checkout mod-instance-reset
        uses: actions/checkout@v7
        with:
          repository: azerothcore/mod-instance-reset
          ref: ${{ steps.lock.outputs.instance_reset_sha }}
          path: modules/mod-instance-reset

      - name: Checkout mod-random-enchants
        uses: actions/checkout@v7
        with:
          repository: azerothcore/mod-random-enchants
          ref: ${{ steps.lock.outputs.random_enchants_sha }}
          path: modules/mod-random-enchants

      - name: Patch mod-playerbots to defer shared quest items to the master
        run: python3 apps/docker/patch-playerbots-quest-loot.py

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: build worldserver
        id: build-worldserver
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/docker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ac-wotlk-worldserver-playerbots:${{ inputs.tag }}
          target: worldserver
          provenance: true
          sbom: true
          build-args: |
            USER_ID=1000
            GROUP_ID=1000
            DOCKER_USER=acore

      - name: Attest worldserver provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ac-wotlk-worldserver-playerbots
          subject-digest: ${{ steps.build-worldserver.outputs.digest }}
          push-to-registry: true

      - name: build authserver
        id: build-authserver
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/docker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ac-wotlk-authserver-playerbots:${{ inputs.tag }}
          target: authserver
          provenance: true
          sbom: true
          build-args: |
            USER_ID=1000
            GROUP_ID=1000
            DOCKER_USER=acore

      - name: Attest authserver provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ac-wotlk-authserver-playerbots
          subject-digest: ${{ steps.build-authserver.outputs.digest }}
          push-to-registry: true

      - name: build db-import
        id: build-db-import
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/docker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ac-wotlk-db-import-playerbots:${{ inputs.tag }}
          target: db-import
          provenance: true
          sbom: true
          build-args: |
            USER_ID=1000
            GROUP_ID=1000
            DOCKER_USER=acore

      - name: Attest db-import provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ac-wotlk-db-import-playerbots
          subject-digest: ${{ steps.build-db-import.outputs.digest }}
          push-to-registry: true

      - name: build client-data
        id: build-client-data
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/docker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ac-wotlk-client-data-playerbots:${{ inputs.tag }}
          target: client-data
          provenance: true
          sbom: true
          build-args: |
            USER_ID=1000
            GROUP_ID=1000
            DOCKER_USER=acore

      - name: Attest client-data provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ac-wotlk-client-data-playerbots
          subject-digest: ${{ steps.build-client-data.outputs.digest }}
          push-to-registry: true
