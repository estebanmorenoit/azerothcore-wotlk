name: esteban-custom-build
# Personal build workflow for this fork — separate from upstream's docker_build.yml,
# which is hard-gated to only ever run/push on mod-playerbots/azerothcore-wotlk and
# would silently no-op here. Manual trigger only, tags images distinctly (never
# ":master") so nothing gets overwritten until validated.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag to build and push'
        required: true
        default: 'ahbot-test'

env:
  DOCKER_BUILDKIT: 1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: build worldserver
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ac-wotlk-worldserver-playerbots:${{ inputs.tag }}
          target: worldserver
          build-args: |
            USER_ID=1000
            GROUP_ID=1000
            DOCKER_USER=acore

      - name: build authserver
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ac-wotlk-authserver-playerbots:${{ inputs.tag }}
          target: authserver
          build-args: |
            USER_ID=1000
            GROUP_ID=1000
            DOCKER_USER=acore

      - name: build db-import
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ac-wotlk-db-import-playerbots:${{ inputs.tag }}
          target: db-import
          build-args: |
            USER_ID=1000
            GROUP_ID=1000
            DOCKER_USER=acore

      - name: build client-data
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ac-wotlk-client-data-playerbots:${{ inputs.tag }}
          target: client-data
          build-args: |
            USER_ID=1000
            GROUP_ID=1000
            DOCKER_USER=acore
