name: sync-upstream
# Watches mod-playerbots/azerothcore-wotlk (the repo this fork was created
# from) for new commits and opens a PR here when it finds any — never
# merges or pushes to Playerbot directly. Detection-only automation: the
# actual decision to bring in upstream changes, and the separate decision
# to rebuild images (build-images.yml, still manual-trigger only) and
# promote a tag to :master in docker-compose.yml, stay manual on purpose.
#
# If the merge itself conflicts, this step just fails loudly (exit 1) —
# no partial or broken branch ever gets pushed. Resolve conflicts locally
# the normal way (`git fetch upstream Playerbot && git merge
# upstream/Playerbot`) and push that instead.
on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday, 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  # Upstream can add/modify files under .github/workflows/ (it did, adding
  # codestyle.yml) - GitHub blocks the default GITHUB_TOKEN from pushing
  # any change to that directory without this scope explicitly granted,
  # regardless of contents: write. Without it, the merge itself succeeds
  # but the push is rejected with "refusing to allow a GitHub App to
  # create or update workflow ... without `workflows` permission".
  workflows: write

jobs:
  check-and-open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: Playerbot
          fetch-depth: 0

      - name: Fetch upstream
        run: git remote add upstream https://github.com/mod-playerbots/azerothcore-wotlk.git && git fetch upstream Playerbot

      - name: Check for new upstream commits
        id: check
        run: |
          count=$(git rev-list --count Playerbot..upstream/Playerbot)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count new commit(s) upstream"

      - name: Skip if nothing new
        if: steps.check.outputs.count == '0'
        run: echo "Up to date with upstream — nothing to do."

      - name: Create sync branch and merge upstream
        if: steps.check.outputs.count != '0'
        run: |
          git config user.name "sync-upstream[bot]"
          git config user.email "actions@github.com"
          git checkout -b sync/upstream-playerbot
          git merge upstream/Playerbot --no-edit
          git push origin sync/upstream-playerbot --force

      - name: List new commits for the PR body
        if: steps.check.outputs.count != '0'
        id: log
        run: |
          delimiter="EOF_$(uuidgen)"
          {
            echo "commits<<$delimiter"
            git log Playerbot..upstream/Playerbot --pretty='- %h %s'
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update PR
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as env vars rather than interpolated directly into the
          # script below (`${{ }}` inside a run: block is a textual
          # substitution done before bash ever sees it — a commit message
          # upstream containing quotes/backticks/`$(...)` could otherwise
          # inject arbitrary shell into this job). Runtime env expansion
          # treats them as inert data instead.
          COMMIT_COUNT: ${{ steps.check.outputs.count }}
          COMMIT_LOG: ${{ steps.log.outputs.commits }}
        run: |
          if gh pr list --head sync/upstream-playerbot --state open --json number --jq '.[0]' | grep -q .; then
            echo "PR already open for sync/upstream-playerbot — updated branch pushed, nothing else to do."
          else
            gh pr create \
              --base Playerbot \
              --head sync/upstream-playerbot \
              --title "Sync ${COMMIT_COUNT} commit(s) from upstream" \
              --body "New commits on mod-playerbots/azerothcore-wotlk's Playerbot branch, merged cleanly into a branch off this fork's Playerbot:

          ${COMMIT_LOG}

          Review and merge when ready — this doesn't touch build-images.yml or any deployed image on its own."
          fi
